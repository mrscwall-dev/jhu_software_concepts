name: Module 5 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: gradcafe_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: gradcafe
      DB_USER: runner
      DB_PASSWORD: ""
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r module_5/requirements.txt
          pip install -e module_5

      - name: Run Pylint
        run: pylint module_5/src --fail-under=10

      - name: Generate dependency graph
        run: |
          cd module_5
          pydeps src/app.py --noshow -T svg -o dependency.svg
          test -f dependency.svg

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk
        run: |
               - name: Run Snyk
        continue-on-error: true
        run: |
          cd module_5
          snyk test cd module_5
          snyk test

      - name: Run tests
        run: pytest module_5/tests -c module_5/pytest.ini
